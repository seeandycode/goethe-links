<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Quick links for Goethe Elementary families.">
<meta name="color-scheme" content="light">
<title>Goethe — Parent Links</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20fill%3D%22%23C8102E%22%20d%3D%22M12%201.6l2.35%206.02%206.45.2-5.06%204-1.74%206.2L12%2014.4%206%2018.02l-1.74-6.2-5.06-4%206.45-.2z%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Both APIs are latency-bound, not payload-bound: the fetches don't start
     until the script at the end of body runs, and most of their cost is the
     TLS handshake. Warming the connections here overlaps that with parsing. -->
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://api.mealviewer.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Public+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10233A;
  --ink-soft:#54687F;
  --paper:#EEF1F4;
  --card:#FFFFFF;
  --line:#D3DBE3;
  --blue:#1B7FB8;
  --red:#C8102E;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Public Sans",system-ui,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 72px}

/* ---------- Masthead ---------- */
header{
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px 26px;
  flex-wrap:wrap;
  border-bottom:2px solid var(--ink);
  margin-bottom:26px;
  padding-top:30px;
  padding-bottom:18px;
}
h1{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;
  font-size:clamp(2.4rem,7vw,3.6rem);
  letter-spacing:-0.03em;
  line-height:0.95;
  margin:0 0 4px;
}
h1 .sub{display:block;font-size:0.3em;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:10px}

/* ---------- Weather ---------- */
.wx{display:flex;align-items:center;gap:12px;padding-bottom:5px}
.wx[hidden]{display:none}
.wx-icon{flex:none;color:var(--blue)}
.wx-temp{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;font-size:2rem;letter-spacing:-0.035em;line-height:0.9;
}
.wx-now{font-size:0.86rem;letter-spacing:-0.006em;margin-bottom:3px}
.wx-meta{
  font-family:"IBM Plex Mono",monospace;font-size:0.66rem;
  color:var(--ink-soft);letter-spacing:0.02em;white-space:nowrap;
}
/* ---------- Classroom ---------- */
.class-card{
  display:flex;flex-wrap:wrap;align-items:center;gap:18px 30px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:15px 17px;
  margin-top:0;
}
.class-label{
  font-family:"IBM Plex Mono",monospace;font-size:0.62rem;
  letter-spacing:0.13em;text-transform:uppercase;
  color:#93A2B2;margin-bottom:4px;
}
.class-who{flex:0 0 auto;min-width:0}
.class-teacher{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:600;font-size:1.14rem;letter-spacing:-0.014em;line-height:1.2;
}
.class-teacher .room{
  font-family:"Public Sans",sans-serif;
  font-weight:400;font-size:0.83rem;color:var(--ink-soft);
  letter-spacing:0;margin-left:9px;
}
.class-times{
  flex:1 1 340px;
  display:flex;flex-wrap:wrap;gap:14px 26px;
  padding-left:30px;border-left:1px solid var(--line);
}
.tm-label{
  font-family:"IBM Plex Mono",monospace;font-size:0.62rem;
  letter-spacing:0.11em;text-transform:uppercase;
  color:#93A2B2;margin-bottom:2px;
}
.tm-time{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:700;font-size:1rem;letter-spacing:-0.02em;line-height:1.1;
}
.tm-where{font-size:0.73rem;color:var(--ink-soft);margin-top:1px}
.ps{
  flex:0 0 auto;
  display:inline-flex;align-items:center;gap:7px;
  background:var(--blue);color:#fff;text-decoration:none;
  border-radius:7px;padding:10px 14px;
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:600;font-size:0.9rem;letter-spacing:-0.008em;
  transition:background .13s ease;
}
.ps:hover,.ps:focus-visible{background:#15688F;outline:none}
.ps:focus-visible{box-shadow:0 0 0 3px rgba(27,127,184,.32)}

/* ---------- Sections ---------- */
section{margin-top:34px}
.sec-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.star{flex:none}
h2{
  font-family:"Bricolage Grotesque",sans-serif;
  font-size:0.86rem;font-weight:700;
  letter-spacing:0.15em;text-transform:uppercase;
  margin:0;
}
.rule{flex:1;height:1px;background:var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:11px}

a.tile{
  display:block;position:relative;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 15px 13px;
  text-decoration:none;color:inherit;
  transition:border-color .13s ease, transform .13s ease, box-shadow .13s ease;
}
a.tile:hover,a.tile:focus-visible{
  border-color:var(--blue);
  transform:translateY(-2px);
  box-shadow:0 5px 16px -8px rgba(16,35,58,.45);
  outline:none;
}
a.tile:focus-visible{box-shadow:0 0 0 3px rgba(27,127,184,.28)}
.tile .name{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:600;font-size:1.02rem;letter-spacing:-0.011em;
  margin-bottom:3px;
}
.tile .desc{font-size:0.83rem;color:var(--ink-soft);line-height:1.4}
.tile .host{
  font-family:"IBM Plex Mono",monospace;font-size:0.65rem;
  color:#93A2B2;margin-top:9px;letter-spacing:0.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tile.todo{border-style:dashed;background:transparent}
.tile.todo .name{color:var(--ink-soft)}

/* ---------- Meals ---------- */
.sec-head .more{
  font-family:"IBM Plex Mono",monospace;font-size:0.66rem;
  color:var(--ink-soft);text-decoration:none;white-space:nowrap;
}
.sec-head .more:hover,.sec-head .more:focus-visible{color:var(--blue)}
.meals{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
.day{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px 13px 13px;
}
.day.today{border-color:var(--blue);box-shadow:0 0 0 2px rgba(27,127,184,.15)}
.day.past{opacity:.5}
.day.wide{grid-column:1/-1}
.day-name{
  display:flex;justify-content:space-between;gap:6px;align-items:baseline;
  font-family:"IBM Plex Mono",monospace;font-size:0.65rem;
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:10px;
}
.day-name .date{color:#93A2B2}
.day.today .day-name{color:var(--blue)}
.day.today .day-name .date{color:var(--blue)}
.meals-inner{display:grid;gap:11px}
.day.solo .meals-inner{grid-template-columns:1fr 1fr;gap:24px}
.meal-label{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:700;font-size:0.61rem;letter-spacing:0.13em;text-transform:uppercase;
  color:#93A2B2;margin-bottom:3px;
}
.meal .main{font-size:0.85rem;line-height:1.35;letter-spacing:-0.006em}
.meal .side{font-size:0.73rem;color:var(--ink-soft);line-height:1.4;margin-top:4px}
.meal .side b{font-weight:500;color:#93A2B2;font-size:0.68rem;letter-spacing:0.04em;text-transform:uppercase}
.day .none{font-size:0.8rem;color:#93A2B2;font-style:italic}
.meals-note{
  font-family:"IBM Plex Mono",monospace;font-size:0.66rem;
  color:#93A2B2;margin-top:11px;line-height:1.7;
}
.meals-note a{color:var(--ink-soft)}
.meals-toggle{
  display:inline-flex;align-items:center;
  margin-top:11px;padding:0;border:0;background:none;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:0.68rem;letter-spacing:0.02em;
  color:var(--blue);
}
.meals-toggle:hover{text-decoration:underline}
.meals-toggle:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:3px}
.meals-toggle[hidden]{display:none}

/* ---------- This week (calendar) ---------- */
.week-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:4px 15px 6px;
}
.evt-day{display:flex;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.evt-day:first-child{border-top:0}
.evt-day.past{opacity:.45}
.when{
  flex:0 0 96px;
  font-family:"IBM Plex Mono",monospace;font-size:0.65rem;
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--ink-soft);padding-top:2px;
}
.when .date{display:block;color:#93A2B2;margin-top:2px}
.evt-day.today .when,.evt-day.today .when .date{color:var(--blue)}
.evt-list{flex:1;min-width:0}
.evt{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:3px 0;align-items:baseline}
.evt-time{font-family:"IBM Plex Mono",monospace;font-size:0.68rem;color:var(--ink-soft)}
.evt-title{font-size:0.9rem;letter-spacing:-0.006em}
.evt-where{font-size:0.75rem;color:#93A2B2;margin-top:1px}
.tag{
  font-family:"IBM Plex Mono",monospace;font-size:0.58rem;
  letter-spacing:0.08em;text-transform:uppercase;
  color:var(--ink-soft);border:1px solid var(--line);border-radius:4px;
  padding:1px 5px;margin-left:7px;white-space:nowrap;vertical-align:1px;
}
.evt-day.next .when{color:var(--red)}
.week-card .none{font-size:0.85rem;color:#93A2B2;font-style:italic;padding:11px 0}

@media (max-width:900px){.meals{grid-template-columns:repeat(2,1fr)}}

@media (max-width:760px){
  .class-times{padding-left:0;border-left:0;flex-basis:100%}
}

@media (max-width:560px){
  header{align-items:flex-start}
  .class-card{gap:14px 22px}
  .class-times{gap:12px 22px}
  .ps{width:100%;justify-content:center}
  .wx-meta{white-space:normal}
  .grid{grid-template-columns:1fr}
  .meals{grid-template-columns:1fr}
  .day.solo .meals-inner{grid-template-columns:1fr}
  .evt-day{display:block}
  .when{margin-bottom:6px}
  .when .date{display:inline;margin:0 0 0 6px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  a.tile:hover{transform:none}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Goethe<span class="sub">Parent links</span></h1>
  <div class="wx" id="wx" hidden></div>
</header>

<!-- Classroom details. Edit the names, times and doors right here. -->
<section id="class" class="class-card">
  <div class="class-who">
    <div class="class-label">Classroom</div>
    <div class="class-teacher">Ms. Lopez<span class="room">Room B106</span></div>
  </div>
  <div class="class-times">
    <div class="tm">
      <div class="tm-label">Drop-off</div>
      <div class="tm-time">7:30 AM</div>
      <div class="tm-where">Door 3</div>
    </div>
    <div class="tm">
      <div class="tm-label">Class starts</div>
      <div class="tm-time">7:45 AM</div>
    </div>
    <div class="tm">
      <div class="tm-label">Dismissal</div>
      <div class="tm-time">2:45 PM</div>
      <div class="tm-where">Door 3</div>
    </div>
  </div>
  <a class="ps" href="https://www.parentsquare.com/signin" target="_blank" rel="noopener">Open ParentSquare &#8599;</a>
</section>

<section id="week">
  <div class="sec-head"><svg class="star" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path fill="#C8102E" d="M12 1.6l2.35 6.02 6.45.2-5.06 4-1.74 6.2L12 14.4 6 18.02l-1.74-6.2-5.06-4 6.45-.2z"/></svg><h2 id="week-head">This week at school</h2><div class="rule"></div><a class="more" href="https://sites.google.com/cps.edu/goetheelementaryschool/our-school/calendar-news" target="_blank" rel="noopener">full calendar &#8599;</a></div>
  <div class="week-card" id="week-card"></div>
  <button class="meals-toggle" id="week-toggle" type="button" hidden aria-controls="week-card" aria-expanded="false">Show the next five days &#9662;</button>
  <div class="meals-note" id="week-note"></div>
</section>

<section id="meals">
  <div class="sec-head"><svg class="star" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path fill="#C8102E" d="M12 1.6l2.35 6.02 6.45.2-5.06 4-1.74 6.2L12 14.4 6 18.02l-1.74-6.2-5.06-4 6.45-.2z"/></svg><h2 id="meals-head">This week&rsquo;s meals</h2><div class="rule"></div><a class="more" href="https://schools.mealviewer.com/school/609942-51115" target="_blank" rel="noopener">full menu &#8599;</a></div>
  <div class="meals" id="meals-grid"></div>
  <button class="meals-toggle" id="meals-toggle" type="button" hidden aria-controls="meals-grid" aria-expanded="false">Show the rest of the week &#9662;</button>
  <div class="meals-note" id="meals-note"></div>
</section>

<main id="board"></main>

</div>

<script>
/* ============================================================
   EDIT HERE. Each group is { group: "...", links: [ ... ] }.
   Each link is { name, desc, url }. Save the file and reload.
   ============================================================ */
const LINKS = [
  {
    group: "Every day",
    links: [
      { name:"Aspen portal",      desc:"Grades, attendance, report cards",          url:"https://aspen.cps.edu/aspen/logon.do" },
      { name:"School calendar",   desc:"Holidays, half days, breaks",               url:"https://www.cps.edu/calendar/" }
    ]
  },
  {
    group: "Goethe itself",
    links: [
      { name:"School website",     desc:"News, staff, bell times",          url:"https://goethe.cps.edu" },
      { name:"Goethe on Facebook", desc:"Official school page",             url:"https://www.facebook.com/GoetheElementary" },
      { name:"Call the office",    desc:"773-534-4135",                     url:"tel:+17735344135" },
      { name:"Directions",         desc:"2236 N Rockwell St",               url:"https://maps.google.com/maps?daddr=2236%20N%20ROCKWELL%20St%2C%20Chicago%2C%20Illinois%2060647" }
    ]
  },
  {
    group: "Parent groups",
    links: [
      { name:"GoetheParentsNetwork",    desc:"",  url:"https://www.facebook.com/share/g/1CrBNHWxzU/" },
      { name:"Friends of Goethe School", desc:"",  url:"https://www.facebook.com/share/19CUqLs7Tv/" }
    ]
  }
];

/* ---------- render ---------- */
const STAR = '<svg class="star" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path fill="#C8102E" d="M12 1.6l2.35 6.02 6.45.2-5.06 4-1.74 6.2L12 14.4 6 18.02l-1.74-6.2-5.06-4 6.45-.2z"/></svg>';

function host(url){
  if(!url) return "not set yet";
  if(url.startsWith("tel:")) return "phone";
  try { return new URL(url).hostname.replace(/^www\./,""); } catch(e){ return ""; }
}

const board = document.getElementById("board");
board.innerHTML = LINKS.map(g => `
  <section>
    <div class="sec-head">${STAR}<h2>${g.group}</h2><div class="rule"></div></div>
    <div class="grid">
      ${g.links.map(l => `
        <a class="tile${l.url ? "" : " todo"}"
           href="${l.url || "#"}"
           ${l.url && !l.url.startsWith("tel:") ? 'target="_blank" rel="noopener"' : ""}>
          <div class="name">${l.name}</div>
          <div class="desc">${l.desc}</div>
          <div class="host">${host(l.url)}</div>
        </a>`).join("")}
    </div>
  </section>`).join("");

/* ============================================================
   MEALS — pulled live from MealViewer's public API.
   Today's meals by default; the rest of the week on request.
   On weekends it rolls forward to the coming Monday.
   ============================================================ */
const MEALVIEWER = "https://schools.mealviewer.com/school/609942-51115";
const MEALS_API  = "https://api.mealviewer.com/api/v4/school/609942-51115";

/* Condiments crowd out the actual food in a narrow column. */
const CONDIMENT = /^(ketchup|mustard|mayonnaise|margarine|jelly|ranch dressing|mild sauce|bbq sauce|hot sauce|syrup)$/i;

/* MealViewer stores section headers as ordinary items, in all caps
   ("FEATURED ENTREES", "AVAILABLE DAILY", "CHOICE OF MILK"). Real food
   always carries lowercase letters, so caps == header is a safe test. */
const isHeader = s => s === s.toUpperCase();

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const apiDate = d => `${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}-${d.getUTCFullYear()}`;
const keyOf = d => d.getUTCFullYear()*10000 + (d.getUTCMonth()+1)*100 + d.getUTCDate();
const dayName = d => new Intl.DateTimeFormat("en-US",{timeZone:"UTC",weekday:"long"}).format(d);

/* "Today" means today in Chicago, not on the visitor's device. */
function chicagoToday(){
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone:"America/Chicago", year:"numeric", month:"2-digit", day:"2-digit"
  }).formatToParts(new Date());
  const get = t => +parts.find(p => p.type === t).value;
  return new Date(Date.UTC(get("year"), get("month")-1, get("day")));
}

function weekToShow(){
  const today = chicagoToday();
  const dow = today.getUTCDay();                    // 0 Sun … 6 Sat
  const monday = new Date(today);
  const shift = dow === 0 ? 1 : dow === 6 ? 2 : -(dow - 1);
  monday.setUTCDate(today.getUTCDate() + shift);
  const friday = new Date(monday);
  friday.setUTCDate(monday.getUTCDate() + 4);
  return { today, monday, friday, ahead: dow === 0 || dow === 6 };
}

function parseBlock(block){
  const items = [];
  (block.cafeteriaLineList?.data || []).forEach(line =>
    items.push(...(line.foodItemList?.data || [])));
  items.sort((a,b) => (a.item_Order_Id || 0) - (b.item_Order_Id || 0));

  const out = { entrees:[], veg:[], fruit:[], daily:[] };
  let header = "";
  for (const f of items){
    const name = (f.item_Name || "").trim();
    if (!name) continue;
    if (isHeader(name)) { header = name; continue; }
    if (CONDIMENT.test(name)) continue;
    if ((f.item_Type || "").toUpperCase() === "MILK") continue;   // same every day
    const bucket = header === "AVAILABLE DAILY" ? out.daily
                 : header === "VEGETABLES"      ? out.veg
                 : header === "FRUITS"          ? out.fruit
                 : out.entrees;
    if (!bucket.includes(name)) bucket.push(name);                // dedupe repeats
  }
  return out;
}

const hasFood = m => !!m && (m.entrees.length + m.veg.length + m.fruit.length) > 0;

function mealHTML(label, meal){
  if (!hasFood(meal)) return "";
  const sides = [];
  if (meal.veg.length)   sides.push(`<b>Veg</b> ${esc(meal.veg.join(", "))}`);
  if (meal.fruit.length) sides.push(`<b>Fruit</b> ${esc(meal.fruit.join(", "))}`);
  return `<div class="meal">
      <div class="meal-label">${label}</div>
      <div class="main">${esc(meal.entrees.join(" · ")) || "—"}</div>
      ${sides.length ? `<div class="side">${sides.join("<br>")}</div>` : ""}
    </div>`;
}

/* solo = the single-day view, which gets the full width and two columns. */
function dayHTML(day, solo){
  const cls = ["day", solo && "wide solo", day.isToday && "today", !solo && day.isPast && "past"]
    .filter(Boolean).join(" ");
  const meals = mealHTML("Breakfast", day.breakfast) + mealHTML("Lunch", day.lunch);
  return `<div class="${cls}">
      <div class="day-name"><span>${day.isToday ? "Today" : esc(day.weekday)}</span><span class="date">${esc(day.date)}</span></div>
      <div class="meals-inner">${meals || '<div class="none">No meals listed</div>'}</div>
    </div>`;
}

function buildDays(data, todayKey){
  return (data.menuSchedules || []).map(sched => {
    const info = sched.dateInformation || {};
    const day = {
      weekday: (info.weekDayName || "").slice(0,3),
      date: `${(info.monthName || "").slice(0,3)} ${info.monthDay}`,
      isToday: info.dateKey === todayKey,
      isPast:  info.dateKey < todayKey
    };
    for (const block of sched.menuBlocks || []){
      const name = block.blockName || "";
      if (/K-8.*breakfast/i.test(name)) day.breakfast = parseBlock(block);
      else if (/K-8.*lunch/i.test(name)) day.lunch = parseBlock(block);
    }
    return day;
  });
}

function paint(days, solo, emptyMsg){
  if (!days.some(d => hasFood(d.breakfast) || hasFood(d.lunch))){
    mealsGrid.innerHTML = `<div class="day wide"><div class="none">${emptyMsg}</div></div>`;
    mealsNote.innerHTML = "";
    return;
  }
  mealsGrid.innerHTML = days.map(d => dayHTML(d, solo)).join("");

  const daily = new Set();
  days.forEach(d => [d.breakfast, d.lunch].forEach(m => m && m.daily.forEach(x => daily.add(x))));
  mealsNote.innerHTML = daily.size
    ? `Available every day: ${esc([...daily].join(", "))}.`
    : "";
}

const mealsGrid   = document.getElementById("meals-grid");
const mealsHead   = document.getElementById("meals-head");
const mealsNote   = document.getElementById("meals-note");
const mealsToggle = document.getElementById("meals-toggle");

const week     = weekToShow();
const todayKey = keyOf(week.today);
const focusDay = week.ahead ? week.monday : week.today;   // weekends point at Monday
const focusWord = week.ahead ? dayName(focusDay) : "today";

const HEAD_ONE  = week.ahead ? `${dayName(focusDay)}'s meals` : "Today's meals";
const HEAD_WEEK = week.ahead ? "Next week's meals" : "This week's meals";

let oneDay   = null;   // the focus day, fetched up front
let weekDays = null;   // the whole week, fetched only if asked for
let expanded = false;

function getMenu(from, to){
  return fetch(`${MEALS_API}/${apiDate(from)}/${apiDate(to)}/0`)
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(data => buildDays(data, todayKey));
}

function showOne(){
  expanded = false;
  mealsHead.textContent = HEAD_ONE;
  paint(oneDay, true, `No school meals ${week.ahead ? "on " + dayName(focusDay) : "today"}.`);
  mealsToggle.hidden = false;
  mealsToggle.textContent = "Show the rest of the week ▾";
  mealsToggle.setAttribute("aria-expanded", "false");
}

function showWeek(){
  expanded = true;
  mealsHead.textContent = HEAD_WEEK;
  paint(weekDays, false, "No school meals this week.");
  mealsToggle.hidden = false;
  mealsToggle.textContent = `Show just ${focusWord} ▴`;
  mealsToggle.setAttribute("aria-expanded", "true");
}

mealsToggle.addEventListener("click", () => {
  if (expanded)   { showOne();  return; }
  if (weekDays)   { showWeek(); return; }

  mealsToggle.textContent = "Loading the week…";
  getMenu(week.monday, week.friday)
    .then(days => { weekDays = days; showWeek(); })
    .catch(() => { mealsToggle.textContent = "Couldn't load the week — tap to retry"; });
});

/* Only the focus day is fetched on load — the week costs ~5x and most
   visits never ask for it. */
mealsHead.textContent = HEAD_ONE;
mealsGrid.innerHTML = '<div class="day wide"><div class="none">Loading&hellip;</div></div>';
getMenu(focusDay, focusDay)
  .then(days => { oneDay = days; showOne(); })
  .catch(() => {
    mealsGrid.innerHTML =
      `<div class="day wide"><div class="none">Couldn't load the menu &mdash;
       <a href="${MEALVIEWER}" target="_blank" rel="noopener">open it on MealViewer</a>.</div></div>`;
    mealsNote.textContent = "";
    mealsToggle.hidden = true;
  });

/* ============================================================
   THIS WEEK — the school's three Google Calendars, Monday to Sunday.
   Google's .ics feeds send no Access-Control-Allow-Origin, so the browser
   can't read them the way it reads MealViewer. A nightly Action bakes them
   into events.json (tools/build-events.py) and the page loads that
   same-origin. Multi-day events show on every day they cover.
   ============================================================ */
const CALENDAR_PAGE = "https://sites.google.com/cps.edu/goetheelementaryschool/our-school/calendar-news";

/* "Goethe Community" is the default voice of the section, so only the two
   narrower calendars earn a tag. */
const CAL_TAG = { sports: "Sports", ost: "After school" };

const weekCard = document.getElementById("week-card");
const weekNote = document.getElementById("week-note");

const isoOf   = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
const shortDay  = d => new Intl.DateTimeFormat("en-US",{timeZone:"UTC",weekday:"short"}).format(d);
const shortDate = d => new Intl.DateTimeFormat("en-US",{timeZone:"UTC",month:"short",day:"numeric"}).format(d);
const dateOf  = s => new Date(`${s}T00:00:00Z`);
const addDays = (d, n) => { const x = new Date(d); x.setUTCDate(d.getUTCDate() + n); return x; };

/* "4pm", "6:30pm" — a round hour doesn't need the ":00". */
function clock(hhmm){
  const [h, m] = hhmm.split(":").map(Number);
  return `${h % 12 || 12}${m ? ":" + pad(m) : ""}${h < 12 ? "am" : "pm"}`;
}

const lastDayOf = e => e.e || e.d;

/* All-day items lead the day, then by start time — don't lean on the order
   events.json happens to arrive in. */
const byTime = (a, b) => (a.t || "").localeCompare(b.t || "");

function eventHTML(e){
  const tag = CAL_TAG[e.c] ? `<span class="tag">${esc(CAL_TAG[e.c])}</span>` : "";
  return `<div class="evt">
      <span class="evt-time">${e.t ? clock(e.t) : ""}</span>
      <span><span class="evt-title">${esc(e.s)}</span>${tag}${
        e.l ? `<div class="evt-where">${esc(e.l)}</div>` : ""}</span>
    </div>`;
}

function rowHTML(label, dateLabel, events, extra){
  return `<div class="evt-day${extra ? " " + extra : ""}">
      <div class="when">${esc(label)}<span class="date">${esc(dateLabel)}</span></div>
      <div class="evt-list">${events.map(eventHTML).join("")}</div>
    </div>`;
}

function dayRow(entry, todayISO){
  return rowHTML(
    entry.key === todayISO ? "Today" : shortDay(entry.day),
    shortDate(entry.day),
    entry.events,
    [entry.key === todayISO && "today", entry.key < todayISO && "past"].filter(Boolean).join(" ")
  );
}

/* One entry per day that has something on it. Multi-day events cover every
   day they span, so a day is matched by range, not by start date. */
function eventsOn(events, key){
  return events.filter(e => key >= e.d && key <= lastDayOf(e)).sort(byTime);
}

function weekEntries(events, monday){
  const out = [];
  for (let i = 0; i < 7; i++){
    const day = addDays(monday, i);
    const onDay = eventsOn(events, isoOf(day));
    if (onDay.length) out.push({ key: isoOf(day), day, events: onDay });
  }
  return out;
}

/* The school calendar is sparse — whole weeks go by with nothing on them — so
   "the next five days" has to mean five days that actually have events, not
   five squares of empty grid. events.json runs ~120 days out; scan a little
   past that and stop early once five are found. */
const SCAN_DAYS = 140;
const NEXT_DAYS = 5;

function nextEntries(events, startISO, limit){
  const out = [];
  let day = dateOf(startISO);
  for (let i = 0; i < SCAN_DAYS && out.length < limit; i++, day = addDays(day, 1)){
    const onDay = eventsOn(events, isoOf(day));
    if (onDay.length) out.push({ key: isoOf(day), day, events: onDay });
  }
  return out;
}

/* Once the week is spent, point at whatever is actually next — an empty
   card in August, when nothing is scheduled yet, tells a parent nothing. */
function nextUp(events, todayISO, sundayISO){
  if (events.some(e => lastDayOf(e) >= todayISO && e.d <= sundayISO)) return null;
  return nextEntries(events, todayISO, 1)[0] || null;
}

const weekToggle = document.getElementById("week-toggle");
const weekHead   = document.getElementById("week-head");

const CAL_HEAD_WEEK = "This week at school";
const CAL_HEAD_NEXT = "Coming up at school";
const EMPTY_CARD = '<div class="none">Nothing on the school calendar right now.</div>';

let calEvents   = [];
let calExpanded = false;
let calToday    = "";
let calMonday   = null;
let calSunday   = "";

function showThisWeek(){
  calExpanded = false;
  weekHead.textContent = CAL_HEAD_WEEK;

  const rows = weekEntries(calEvents, calMonday).map(e => dayRow(e, calToday));
  const soon = nextUp(calEvents, calToday, calSunday);
  if (soon){
    rows.push(rowHTML("Next up", `${shortDay(soon.day)} ${shortDate(soon.day)}`,
      soon.events, "next"));
  }

  weekCard.innerHTML = rows.length ? rows.join("") : EMPTY_CARD;
  weekToggle.textContent = "Show the next five days \u25BE";
  weekToggle.setAttribute("aria-expanded", "false");
}

function showNextDays(){
  calExpanded = true;
  weekHead.textContent = CAL_HEAD_NEXT;

  const entries = nextEntries(calEvents, calToday, NEXT_DAYS);
  weekCard.innerHTML = entries.length
    ? entries.map(e => dayRow(e, calToday)).join("")
    : EMPTY_CARD;
  weekToggle.textContent = "Show just this week \u25B4";
  weekToggle.setAttribute("aria-expanded", "true");
}

weekToggle.addEventListener("click", () => {
  (calExpanded ? showThisWeek : showNextDays)();
});

function renderWeek(events){
  const today = chicagoToday();
  calEvents = events;
  calToday  = isoOf(today);
  calMonday = addDays(today, -((today.getUTCDay() + 6) % 7));   // Sun counts as day 7
  calSunday = isoOf(addDays(calMonday, 6));

  showThisWeek();

  /* Nothing to expand into if the week view already shows every day the next
     five would. */
  const shown = new Set(weekEntries(events, calMonday).map(e => e.key));
  const soon = nextUp(events, calToday, calSunday);
  if (soon) shown.add(soon.key);
  weekToggle.hidden = !nextEntries(events, calToday, NEXT_DAYS).some(e => !shown.has(e.key));
}

function weekFailed(){
  weekCard.innerHTML = `<div class="none">Couldn't load the calendar &mdash;
    <a href="${CALENDAR_PAGE}" target="_blank" rel="noopener">open it on the school site</a>.</div>`;
  weekNote.textContent = "";
  weekToggle.hidden = true;
}

weekCard.innerHTML = '<div class="none">Loading&hellip;</div>';
fetch("events.json")
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(data => {
    renderWeek(data.events || []);
    const note = ["Goethe Community, sports, and after-school calendars, refreshed nightly."];
    /* If the nightly job has been failing, say so rather than quietly showing
       a calendar that has stopped moving. */
    const age = (Date.now() - Date.parse(data.generated)) / 86400000;
    if (age > 7) note.push(`Last synced ${shortDate(dateOf(data.generated.slice(0,10)))}.`);
    weekNote.textContent = note.join(" ");
  })
  .catch(weekFailed);

/* ============================================================
   WEATHER — Open-Meteo, keyless and CORS-open, for 60647
   (Logan Square). One call gets the current reading and today's
   high, low, and rain odds. It's decoration on a links page, so a
   failed fetch just leaves the strip hidden rather than apologising.
   ============================================================ */
const WX_API = "https://api.open-meteo.com/v1/forecast?latitude=41.921&longitude=-87.701"
  + "&current=temperature_2m,apparent_temperature,weather_code,is_day"
  + "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max"
  + "&temperature_unit=fahrenheit&timezone=America%2FChicago&forecast_days=1";

/* WMO codes, collapsed to the words a parent deciding on a coat needs. */
const WX_CODE = {
  0:["Clear","sun"],            1:["Mostly clear","sun-cloud"], 2:["Partly cloudy","sun-cloud"],
  3:["Overcast","cloud"],       45:["Fog","fog"],               48:["Freezing fog","fog"],
  51:["Light drizzle","rain"],  53:["Drizzle","rain"],          55:["Heavy drizzle","rain"],
  56:["Freezing drizzle","rain"], 57:["Freezing drizzle","rain"],
  61:["Light rain","rain"],     63:["Rain","rain"],             65:["Heavy rain","rain"],
  66:["Freezing rain","rain"],  67:["Freezing rain","rain"],
  71:["Light snow","snow"],     73:["Snow","snow"],             75:["Heavy snow","snow"],
  77:["Snow grains","snow"],
  80:["Showers","rain"],        81:["Showers","rain"],          82:["Heavy showers","rain"],
  85:["Snow showers","snow"],   86:["Snow showers","snow"],
  95:["Thunderstorms","storm"], 96:["Thunderstorms","storm"],   99:["Thunderstorms","storm"]
};

const CLOUD = 'M7.6 18.6h9.2a3.7 3.7 0 0 0 .4-7.4 5.2 5.2 0 0 0-10-1.2 3.2 3.2 0 0 0 .4 8.6z';
const SUN_RAYS = [[12,1.6,12,3.9],[12,20.1,12,22.4],[3.4,12,5.7,12],[18.3,12,20.6,12],
                  [5.9,5.9,7.5,7.5],[16.5,16.5,18.1,18.1],[18.1,5.9,16.5,7.5],[7.5,16.5,5.9,18.1]];
const rays = SUN_RAYS.map(([x1,y1,x2,y2]) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`).join("");
const drops = y => [8.5,12,15.5]
  .map(x => `<line x1="${x}" y1="${y}" x2="${x-1.3}" y2="${y+3.4}"/>`).join("");
const flakes = y => [8.5,12,15.5]
  .map(x => `<line x1="${x}" y1="${y+0.4}" x2="${x}" y2="${y+2.9}"/>`).join("");

const WX_ICON = {
  "sun":       `<circle cx="12" cy="12" r="4.2"/>${rays}`,
  "moon":      `<path d="M20.4 14.9A8.6 8.6 0 0 1 9.4 3.7 7.9 7.9 0 1 0 20.4 15z"/>`,
  "sun-cloud": `<circle cx="8.6" cy="7.6" r="3"/><line x1="8.6" y1="1.7" x2="8.6" y2="3.2"/>
                <line x1="2.7" y1="7.6" x2="4.2" y2="7.6"/><line x1="4.4" y1="3.4" x2="5.5" y2="4.5"/>
                <line x1="12.8" y1="3.4" x2="11.7" y2="4.5"/><path d="${CLOUD}"/>`,
  "cloud":     `<path d="${CLOUD}"/>`,
  "fog":       `<path d="M7.6 14.6h9.2a3.7 3.7 0 0 0 .4-7.4 5.2 5.2 0 0 0-10-1.2 3.2 3.2 0 0 0 .4 8.6z"/>
                <line x1="5" y1="18.2" x2="19" y2="18.2"/><line x1="7.5" y1="21.4" x2="16.5" y2="21.4"/>`,
  "rain":      `<path d="M7.6 14.6h9.2a3.7 3.7 0 0 0 .4-7.4 5.2 5.2 0 0 0-10-1.2 3.2 3.2 0 0 0 .4 8.6z"/>${drops(17.6)}`,
  "snow":      `<path d="M7.6 14.6h9.2a3.7 3.7 0 0 0 .4-7.4 5.2 5.2 0 0 0-10-1.2 3.2 3.2 0 0 0 .4 8.6z"/>${flakes(17.6)}`,
  "storm":     `<path d="M7.6 14.6h9.2a3.7 3.7 0 0 0 .4-7.4 5.2 5.2 0 0 0-10-1.2 3.2 3.2 0 0 0 .4 8.6z"/>
                <path d="M12.9 16.4l-2.6 3.6h3l-1.2 2.6"/>`
};

function wxIcon(name){
  return `<svg class="wx-icon" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"
     fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
     stroke-linejoin="round">${WX_ICON[name] || WX_ICON.cloud}</svg>`;
}

const wxBox = document.getElementById("wx");

function paintWeather(data){
  const now = data.current, day = data.daily;
  const [word, glyph] = WX_CODE[now.weather_code] || ["", "cloud"];
  /* A clear night still reads "Clear", but a sun on it would be a lie. */
  const icon = (!now.is_day && (glyph === "sun" || glyph === "sun-cloud")) ? "moon" : glyph;

  const round = n => Math.round(n);
  const feels = Math.abs(now.apparent_temperature - now.temperature_2m) >= 4
    ? `feels ${round(now.apparent_temperature)}°` : "";
  const rain = day.precipitation_probability_max[0];

  const meta = [
    `H ${round(day.temperature_2m_max[0])}° · L ${round(day.temperature_2m_min[0])}°`,
    rain >= 20 ? `${rain}% rain` : "",
    feels
  ].filter(Boolean).join(" · ");

  wxBox.innerHTML = `${wxIcon(icon)}
    <div class="wx-temp">${round(now.temperature_2m)}°</div>
    <div>
      <div class="wx-now">${esc(word)}</div>
      <div class="wx-meta">${esc(meta)}</div>
    </div>`;
  wxBox.hidden = false;
}

fetch(WX_API)
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(paintWeather)
  .catch(() => {});   /* no weather is better than an error in the masthead */

</script>
</body>
</html>
