<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Quick links for Goethe Elementary families.">
<meta name="color-scheme" content="light">
<title>Goethe — Parent Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Public+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10233A;
  --ink-soft:#54687F;
  --paper:#EEF1F4;
  --card:#FFFFFF;
  --line:#D3DBE3;
  --blue:#1B7FB8;
  --red:#C8102E;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Public Sans",system-ui,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 72px}

/* ---------- Masthead ---------- */
header{
  border-bottom:2px solid var(--ink);
  margin-bottom:26px;
  padding-top:30px;
  padding-bottom:18px;
}
h1{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;
  font-size:clamp(2.4rem,7vw,3.6rem);
  letter-spacing:-0.03em;
  line-height:0.95;
  margin:0 0 4px;
}
h1 .sub{display:block;font-size:0.3em;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:10px}
/* ---------- Search ---------- */
.search-row{display:flex;gap:10px;align-items:center;margin:26px 0 8px}
#q{
  flex:1;min-width:0;
  font-family:"Public Sans",sans-serif;font-size:1rem;
  padding:12px 14px;
  border:1.5px solid var(--line);border-radius:var(--radius);
  background:var(--card);color:var(--ink);
}
#q::placeholder{color:#93A2B2}
#q:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(27,127,184,.16)}
.hint{
  font-family:"IBM Plex Mono",monospace;font-size:0.7rem;color:var(--ink-soft);
  white-space:nowrap;
}
.hint kbd{
  font-family:inherit;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;background:var(--card);
}

/* ---------- Sections ---------- */
section{margin-top:34px}
.sec-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.star{flex:none}
h2{
  font-family:"Bricolage Grotesque",sans-serif;
  font-size:0.86rem;font-weight:700;
  letter-spacing:0.15em;text-transform:uppercase;
  margin:0;
}
.rule{flex:1;height:1px;background:var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:11px}

a.tile{
  display:block;position:relative;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 15px 13px;
  text-decoration:none;color:inherit;
  transition:border-color .13s ease, transform .13s ease, box-shadow .13s ease;
}
a.tile:hover,a.tile:focus-visible{
  border-color:var(--blue);
  transform:translateY(-2px);
  box-shadow:0 5px 16px -8px rgba(16,35,58,.45);
  outline:none;
}
a.tile:focus-visible{box-shadow:0 0 0 3px rgba(27,127,184,.28)}
.tile .name{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:600;font-size:1.02rem;letter-spacing:-0.011em;
  margin-bottom:3px;
}
.tile .desc{font-size:0.83rem;color:var(--ink-soft);line-height:1.4}
.tile .host{
  font-family:"IBM Plex Mono",monospace;font-size:0.65rem;
  color:#93A2B2;margin-top:9px;letter-spacing:0.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tile.todo{border-style:dashed;background:transparent}
.tile.todo .name{color:var(--ink-soft)}

.empty{
  font-size:0.9rem;color:var(--ink-soft);
  padding:26px 0;
}
footer{
  margin-top:44px;padding-top:16px;border-top:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:0.68rem;color:#93A2B2;
  line-height:1.7;
}

/* ---------- Meals ---------- */
.sec-head .more{
  font-family:"IBM Plex Mono",monospace;font-size:0.66rem;
  color:var(--ink-soft);text-decoration:none;white-space:nowrap;
}
.sec-head .more:hover,.sec-head .more:focus-visible{color:var(--blue)}
.meals{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
.day{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px 13px 13px;
}
.day.today{border-color:var(--blue);box-shadow:0 0 0 2px rgba(27,127,184,.15)}
.day.past{opacity:.5}
.day.wide{grid-column:1/-1}
.day-name{
  display:flex;justify-content:space-between;gap:6px;align-items:baseline;
  font-family:"IBM Plex Mono",monospace;font-size:0.65rem;
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:10px;
}
.day-name .date{color:#93A2B2}
.day.today .day-name{color:var(--blue)}
.day.today .day-name .date{color:var(--blue)}
.meals-inner{display:grid;gap:11px}
.day.solo .meals-inner{grid-template-columns:1fr 1fr;gap:24px}
.meal-label{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:700;font-size:0.61rem;letter-spacing:0.13em;text-transform:uppercase;
  color:#93A2B2;margin-bottom:3px;
}
.meal .main{font-size:0.85rem;line-height:1.35;letter-spacing:-0.006em}
.meal .side{font-size:0.73rem;color:var(--ink-soft);line-height:1.4;margin-top:4px}
.meal .side b{font-weight:500;color:#93A2B2;font-size:0.68rem;letter-spacing:0.04em;text-transform:uppercase}
.day .none{font-size:0.8rem;color:#93A2B2;font-style:italic}
.meals-note{
  font-family:"IBM Plex Mono",monospace;font-size:0.66rem;
  color:#93A2B2;margin-top:11px;line-height:1.7;
}
.meals-note a{color:var(--ink-soft)}
.meals-toggle{
  display:inline-flex;align-items:center;
  margin-top:11px;padding:0;border:0;background:none;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:0.68rem;letter-spacing:0.02em;
  color:var(--blue);
}
.meals-toggle:hover{text-decoration:underline}
.meals-toggle:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:3px}
.meals-toggle[hidden]{display:none}

@media (max-width:900px){.meals{grid-template-columns:repeat(2,1fr)}}

@media (max-width:560px){
  .hint{display:none}
  .grid{grid-template-columns:1fr}
  .meals{grid-template-columns:1fr}
  .day.solo .meals-inner{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  a.tile:hover{transform:none}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Goethe<span class="sub">Parent links</span></h1>
</header>

<div class="search-row">
  <input id="q" type="search" placeholder="Filter links — try “lunch”, “absence”, “calendar”" autocomplete="off">
  <span class="hint">press <kbd>/</kbd> to search</span>
</div>

<section id="meals">
  <div class="sec-head"><svg class="star" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path fill="#C8102E" d="M12 1.6l2.35 6.02 6.45.2-5.06 4-1.74 6.2L12 14.4 6 18.02l-1.74-6.2-5.06-4 6.45-.2z"/></svg><h2 id="meals-head">This week&rsquo;s meals</h2><div class="rule"></div><a class="more" href="https://schools.mealviewer.com/school/609942-51115" target="_blank" rel="noopener">full menu &#8599;</a></div>
  <div class="meals" id="meals-grid"></div>
  <button class="meals-toggle" id="meals-toggle" type="button" hidden aria-controls="meals-grid" aria-expanded="false">Show the rest of the week &#9662;</button>
  <div class="meals-note" id="meals-note"></div>
</section>

<main id="board"></main>

<footer>
  Edit the LINKS list near the top of this file's script to add, remove, or reorder anything.<br>
  Meals load live from MealViewer each time the page opens &mdash; nothing to update by hand.
</footer>

</div>

<script>
/* ============================================================
   EDIT HERE. Each group is { group: "...", links: [ ... ] }.
   Each link is { name, desc, url }. Save the file and reload.
   ============================================================ */
const LINKS = [
  {
    group: "Every day",
    links: [
      { name:"Aspen portal",      desc:"Grades, attendance, report cards",          url:"https://aspen.cps.edu/aspen/logon.do" },
      { name:"School calendar",   desc:"Holidays, half days, breaks",               url:"https://www.cps.edu/calendar/" }
    ]
  },
  {
    group: "Goethe itself",
    links: [
      { name:"School website",     desc:"News, staff, bell times",          url:"https://goethe.cps.edu" },
      { name:"Goethe on Facebook", desc:"Official school page",             url:"https://www.facebook.com/GoetheElementary" },
      { name:"Call the office",    desc:"773-534-4135",                     url:"tel:+17735344135" },
      { name:"Directions",         desc:"2236 N Rockwell St",               url:"https://maps.google.com/maps?daddr=2236%20N%20ROCKWELL%20St%2C%20Chicago%2C%20Illinois%2060647" }
    ]
  },
  {
    group: "Parent groups",
    links: [
      { name:"GoetheParentsNetwork",    desc:"",  url:"https://www.facebook.com/share/g/1CrBNHWxzU/" },
      { name:"Friends of Goethe School", desc:"",  url:"https://www.facebook.com/share/19CUqLs7Tv/" }
    ]
  }
];

/* ---------- render ---------- */
const STAR = '<svg class="star" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path fill="#C8102E" d="M12 1.6l2.35 6.02 6.45.2-5.06 4-1.74 6.2L12 14.4 6 18.02l-1.74-6.2-5.06-4 6.45-.2z"/></svg>';

function host(url){
  if(!url) return "not set yet";
  if(url.startsWith("tel:")) return "phone";
  try { return new URL(url).hostname.replace(/^www\./,""); } catch(e){ return ""; }
}

const board = document.getElementById("board");
board.innerHTML = LINKS.map(g => `
  <section data-group>
    <div class="sec-head">${STAR}<h2>${g.group}</h2><div class="rule"></div></div>
    <div class="grid">
      ${g.links.map(l => `
        <a class="tile${l.url ? "" : " todo"}"
           href="${l.url || "#"}"
           ${l.url && !l.url.startsWith("tel:") ? 'target="_blank" rel="noopener"' : ""}
           data-search="${(l.name + " " + l.desc + " " + g.group).toLowerCase()}">
          <div class="name">${l.name}</div>
          <div class="desc">${l.desc}</div>
          <div class="host">${host(l.url)}</div>
        </a>`).join("")}
    </div>
  </section>`).join("") + '<div class="empty" id="noresults" hidden>Nothing matches that.</div>';

/* ---------- filter ---------- */
const q = document.getElementById("q");
const noresults = document.getElementById("noresults");

q.addEventListener("input", () => {
  const term = q.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll("section[data-group]").forEach(sec => {
    let visible = 0;
    sec.querySelectorAll("a.tile").forEach(t => {
      const hit = !term || t.dataset.search.includes(term);
      t.hidden = !hit;
      if (hit) visible++;
    });
    sec.hidden = visible === 0;
    shown += visible;
  });
  /* Meals aren't tiles, so they match on their own text plus a few aliases. */
  const mealHit = !term
    || "meals lunch breakfast menu food cafeteria".includes(term)
    || mealsSec.textContent.toLowerCase().includes(term);
  mealsSec.hidden = !mealHit;
  if (mealHit) shown++;

  noresults.hidden = shown > 0;
});

document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === "Escape" && document.activeElement === q) { q.value=""; q.dispatchEvent(new Event("input")); q.blur(); }
});

/* ============================================================
   MEALS — pulled live from MealViewer's public API.
   Today's meals by default; the rest of the week on request.
   On weekends it rolls forward to the coming Monday.
   ============================================================ */
const MEALVIEWER = "https://schools.mealviewer.com/school/609942-51115";
const MEALS_API  = "https://api.mealviewer.com/api/v4/school/609942-51115";

/* Condiments crowd out the actual food in a narrow column. */
const CONDIMENT = /^(ketchup|mustard|mayonnaise|margarine|jelly|ranch dressing|mild sauce|bbq sauce|hot sauce|syrup)$/i;

/* MealViewer stores section headers as ordinary items, in all caps
   ("FEATURED ENTREES", "AVAILABLE DAILY", "CHOICE OF MILK"). Real food
   always carries lowercase letters, so caps == header is a safe test. */
const isHeader = s => s === s.toUpperCase();

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const apiDate = d => `${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}-${d.getUTCFullYear()}`;
const keyOf = d => d.getUTCFullYear()*10000 + (d.getUTCMonth()+1)*100 + d.getUTCDate();
const dayName = d => new Intl.DateTimeFormat("en-US",{timeZone:"UTC",weekday:"long"}).format(d);

/* "Today" means today in Chicago, not on the visitor's device. */
function chicagoToday(){
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone:"America/Chicago", year:"numeric", month:"2-digit", day:"2-digit"
  }).formatToParts(new Date());
  const get = t => +parts.find(p => p.type === t).value;
  return new Date(Date.UTC(get("year"), get("month")-1, get("day")));
}

function weekToShow(){
  const today = chicagoToday();
  const dow = today.getUTCDay();                    // 0 Sun … 6 Sat
  const monday = new Date(today);
  const shift = dow === 0 ? 1 : dow === 6 ? 2 : -(dow - 1);
  monday.setUTCDate(today.getUTCDate() + shift);
  const friday = new Date(monday);
  friday.setUTCDate(monday.getUTCDate() + 4);
  return { today, monday, friday, ahead: dow === 0 || dow === 6 };
}

function parseBlock(block){
  const items = [];
  (block.cafeteriaLineList?.data || []).forEach(line =>
    items.push(...(line.foodItemList?.data || [])));
  items.sort((a,b) => (a.item_Order_Id || 0) - (b.item_Order_Id || 0));

  const out = { entrees:[], veg:[], fruit:[], daily:[] };
  let header = "";
  for (const f of items){
    const name = (f.item_Name || "").trim();
    if (!name) continue;
    if (isHeader(name)) { header = name; continue; }
    if (CONDIMENT.test(name)) continue;
    if ((f.item_Type || "").toUpperCase() === "MILK") continue;   // same every day
    const bucket = header === "AVAILABLE DAILY" ? out.daily
                 : header === "VEGETABLES"      ? out.veg
                 : header === "FRUITS"          ? out.fruit
                 : out.entrees;
    if (!bucket.includes(name)) bucket.push(name);                // dedupe repeats
  }
  return out;
}

const hasFood = m => !!m && (m.entrees.length + m.veg.length + m.fruit.length) > 0;

function mealHTML(label, meal){
  if (!hasFood(meal)) return "";
  const sides = [];
  if (meal.veg.length)   sides.push(`<b>Veg</b> ${esc(meal.veg.join(", "))}`);
  if (meal.fruit.length) sides.push(`<b>Fruit</b> ${esc(meal.fruit.join(", "))}`);
  return `<div class="meal">
      <div class="meal-label">${label}</div>
      <div class="main">${esc(meal.entrees.join(" · ")) || "—"}</div>
      ${sides.length ? `<div class="side">${sides.join("<br>")}</div>` : ""}
    </div>`;
}

/* solo = the single-day view, which gets the full width and two columns. */
function dayHTML(day, solo){
  const cls = ["day", solo && "wide solo", day.isToday && "today", !solo && day.isPast && "past"]
    .filter(Boolean).join(" ");
  const meals = mealHTML("Breakfast", day.breakfast) + mealHTML("Lunch", day.lunch);
  return `<div class="${cls}">
      <div class="day-name"><span>${day.isToday ? "Today" : esc(day.weekday)}</span><span class="date">${esc(day.date)}</span></div>
      <div class="meals-inner">${meals || '<div class="none">No meals listed</div>'}</div>
    </div>`;
}

function buildDays(data, todayKey){
  return (data.menuSchedules || []).map(sched => {
    const info = sched.dateInformation || {};
    const day = {
      weekday: (info.weekDayName || "").slice(0,3),
      date: `${(info.monthName || "").slice(0,3)} ${info.monthDay}`,
      isToday: info.dateKey === todayKey,
      isPast:  info.dateKey < todayKey
    };
    for (const block of sched.menuBlocks || []){
      const name = block.blockName || "";
      if (/K-8.*breakfast/i.test(name)) day.breakfast = parseBlock(block);
      else if (/K-8.*lunch/i.test(name)) day.lunch = parseBlock(block);
    }
    return day;
  });
}

function paint(days, solo, emptyMsg){
  if (!days.some(d => hasFood(d.breakfast) || hasFood(d.lunch))){
    mealsGrid.innerHTML = `<div class="day wide"><div class="none">${emptyMsg}</div></div>`;
    mealsNote.innerHTML = "";
    return;
  }
  mealsGrid.innerHTML = days.map(d => dayHTML(d, solo)).join("");

  const daily = new Set();
  days.forEach(d => [d.breakfast, d.lunch].forEach(m => m && m.daily.forEach(x => daily.add(x))));
  mealsNote.innerHTML = daily.size
    ? `Available every day: ${esc([...daily].join(", "))}.`
    : "";
}

const mealsSec    = document.getElementById("meals");
const mealsGrid   = document.getElementById("meals-grid");
const mealsHead   = document.getElementById("meals-head");
const mealsNote   = document.getElementById("meals-note");
const mealsToggle = document.getElementById("meals-toggle");

const week     = weekToShow();
const todayKey = keyOf(week.today);
const focusDay = week.ahead ? week.monday : week.today;   // weekends point at Monday
const focusWord = week.ahead ? dayName(focusDay) : "today";

const HEAD_ONE  = week.ahead ? `${dayName(focusDay)}'s meals` : "Today's meals";
const HEAD_WEEK = week.ahead ? "Next week's meals" : "This week's meals";

let oneDay   = null;   // the focus day, fetched up front
let weekDays = null;   // the whole week, fetched only if asked for
let expanded = false;

function getMenu(from, to){
  return fetch(`${MEALS_API}/${apiDate(from)}/${apiDate(to)}/0`)
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(data => buildDays(data, todayKey));
}

function showOne(){
  expanded = false;
  mealsHead.textContent = HEAD_ONE;
  paint(oneDay, true, `No school meals ${week.ahead ? "on " + dayName(focusDay) : "today"}.`);
  mealsToggle.hidden = false;
  mealsToggle.textContent = "Show the rest of the week ▾";
  mealsToggle.setAttribute("aria-expanded", "false");
}

function showWeek(){
  expanded = true;
  mealsHead.textContent = HEAD_WEEK;
  paint(weekDays, false, "No school meals this week.");
  mealsToggle.hidden = false;
  mealsToggle.textContent = `Show just ${focusWord} ▴`;
  mealsToggle.setAttribute("aria-expanded", "true");
}

mealsToggle.addEventListener("click", () => {
  if (expanded)   { showOne();  q.dispatchEvent(new Event("input")); return; }
  if (weekDays)   { showWeek(); q.dispatchEvent(new Event("input")); return; }

  mealsToggle.textContent = "Loading the week…";
  getMenu(week.monday, week.friday)
    .then(days => { weekDays = days; showWeek(); })
    .catch(() => { mealsToggle.textContent = "Couldn't load the week — tap to retry"; })
    .finally(() => q.dispatchEvent(new Event("input")));
});

/* Only the focus day is fetched on load — the week costs ~5x and most
   visits never ask for it. */
mealsHead.textContent = HEAD_ONE;
mealsGrid.innerHTML = '<div class="day wide"><div class="none">Loading&hellip;</div></div>';
getMenu(focusDay, focusDay)
  .then(days => { oneDay = days; showOne(); })
  .catch(() => {
    mealsGrid.innerHTML =
      `<div class="day wide"><div class="none">Couldn't load the menu &mdash;
       <a href="${MEALVIEWER}" target="_blank" rel="noopener">open it on MealViewer</a>.</div></div>`;
    mealsNote.textContent = "";
    mealsToggle.hidden = true;
  })
  .finally(() => q.dispatchEvent(new Event("input")));   // re-apply an active filter

</script>
</body>
</html>
