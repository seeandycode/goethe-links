<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Quick links for Goethe Elementary families.">
<meta name="color-scheme" content="light">
<title>Goethe — Parent Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Public+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10233A;
  --ink-soft:#54687F;
  --paper:#EEF1F4;
  --card:#FFFFFF;
  --line:#D3DBE3;
  --blue:#1B7FB8;
  --red:#C8102E;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Public Sans",system-ui,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 72px}

/* ---------- Masthead ---------- */
header{
  border-bottom:2px solid var(--ink);
  margin-bottom:26px;
  padding-top:30px;
  padding-bottom:18px;
}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
h1{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;
  font-size:clamp(2.4rem,7vw,3.6rem);
  letter-spacing:-0.03em;
  line-height:0.95;
  margin:0 0 4px;
}
h1 .sub{display:block;font-size:0.3em;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:10px}
.facts{
  font-family:"IBM Plex Mono",monospace;
  font-size:0.72rem;
  color:var(--ink-soft);
  text-align:right;
  line-height:1.7;
  padding-bottom:6px;
}
.facts a{color:var(--ink-soft)}
.facts strong{color:var(--ink);font-weight:500}

/* ---------- Search ---------- */
.search-row{display:flex;gap:10px;align-items:center;margin:26px 0 8px}
#q{
  flex:1;min-width:0;
  font-family:"Public Sans",sans-serif;font-size:1rem;
  padding:12px 14px;
  border:1.5px solid var(--line);border-radius:var(--radius);
  background:var(--card);color:var(--ink);
}
#q::placeholder{color:#93A2B2}
#q:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(27,127,184,.16)}
.hint{
  font-family:"IBM Plex Mono",monospace;font-size:0.7rem;color:var(--ink-soft);
  white-space:nowrap;
}
.hint kbd{
  font-family:inherit;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;background:var(--card);
}

/* ---------- Sections ---------- */
section{margin-top:34px}
.sec-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.star{flex:none}
h2{
  font-family:"Bricolage Grotesque",sans-serif;
  font-size:0.86rem;font-weight:700;
  letter-spacing:0.15em;text-transform:uppercase;
  margin:0;
}
.rule{flex:1;height:1px;background:var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:11px}

a.tile{
  display:block;position:relative;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 15px 13px;
  text-decoration:none;color:inherit;
  transition:border-color .13s ease, transform .13s ease, box-shadow .13s ease;
}
a.tile:hover,a.tile:focus-visible{
  border-color:var(--blue);
  transform:translateY(-2px);
  box-shadow:0 5px 16px -8px rgba(16,35,58,.45);
  outline:none;
}
a.tile:focus-visible{box-shadow:0 0 0 3px rgba(27,127,184,.28)}
.tile .name{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:600;font-size:1.02rem;letter-spacing:-0.011em;
  margin-bottom:3px;
}
.tile .desc{font-size:0.83rem;color:var(--ink-soft);line-height:1.4}
.tile .host{
  font-family:"IBM Plex Mono",monospace;font-size:0.65rem;
  color:#93A2B2;margin-top:9px;letter-spacing:0.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tile.todo{border-style:dashed;background:transparent}
.tile.todo .name{color:var(--ink-soft)}

.empty{
  font-size:0.9rem;color:var(--ink-soft);
  padding:26px 0;
}
footer{
  margin-top:44px;padding-top:16px;border-top:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:0.68rem;color:#93A2B2;
  line-height:1.7;
}

@media (max-width:560px){
  .facts{text-align:left}
  .hint{display:none}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  a.tile:hover{transform:none}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="title-row">
    <h1>Goethe<span class="sub">Parent links · Logan Square</span></h1>
    <div class="facts">
      <div><strong>2236 N Rockwell St</strong>, Chicago 60647</div>
      <div><a href="tel:+17735344135">773-534-4135</a> · office</div>
      <div>Principal Nader Elmasri</div>
    </div>
  </div>
</header>

<div class="search-row">
  <input id="q" type="search" placeholder="Filter links — try “lunch”, “absence”, “calendar”" autocomplete="off">
  <span class="hint">press <kbd>/</kbd> to search</span>
</div>

<main id="board"></main>

<footer>
  Edit the LINKS list near the top of this file's script to add, remove, or reorder anything.
</footer>

</div>

<script>
/* ============================================================
   EDIT HERE. Each group is { group: "...", links: [ ... ] }.
   Each link is { name, desc, url }. Save the file and reload.
   ============================================================ */
const LINKS = [
  {
    group: "Every day",
    links: [
      { name:"Lunch menu",        desc:"Goethe's breakfast + lunch on MealViewer", url:"https://schools.mealviewer.com/school/609942-51115" },
      { name:"Report an absence", desc:"Excused absence form",                     url:"https://www.cps.edu/schools/student-attendance/report-absence/" },
      { name:"Aspen portal",      desc:"Grades, attendance, report cards",          url:"https://www.cps.edu/services-and-supports/parent-and-student-portal/" },
      { name:"School calendar",   desc:"Holidays, half days, breaks",               url:"https://www.cps.edu/calendar/" },
      { name:"Cold + snow days",  desc:"When CPS closes or goes remote",            url:"https://www.cps.edu/services-and-supports/weather-guidelines/" }
    ]
  },
  {
    group: "Goethe itself",
    links: [
      { name:"School website",     desc:"News, staff, bell times",          url:"https://goethe.cps.edu" },
      { name:"Goethe on Facebook", desc:"Official school page",             url:"https://www.facebook.com/GoetheElementary" },
      { name:"CPS school profile", desc:"Programs, data, contacts",         url:"https://www.cps.edu/schools/profiles/school-overview/609942" },
      { name:"Call the office",    desc:"773-534-4135",                     url:"tel:+17735344135" },
      { name:"Directions",         desc:"2236 N Rockwell St",               url:"https://maps.google.com/maps?daddr=2236%20N%20ROCKWELL%20St%2C%20Chicago%2C%20Illinois%2060647" }
    ]
  },
  {
    group: "Parent groups",
    links: [
      { name:"GoetheParentsNetwork",    desc:"",  url:"https://www.facebook.com/share/g/1CrBNHWxzU/" },
      { name:"Friends of Goethe School", desc:"",  url:"https://www.facebook.com/share/19CUqLs7Tv/" }
    ]
  },
  {
    group: "Forms + health",
    links: [
      { name:"Health forms",        desc:"Physical, dental, vision, immunizations", url:"https://www.cps.edu/services-and-supports/health-and-wellness/health-forms/" },
      { name:"Back to school",      desc:"Supply lists, first-day info",            url:"https://www.cps.edu/sites/back-to-school/" },
      { name:"Code of conduct",     desc:"District discipline policy",              url:"https://www.cps.edu/about/policies/student-code-of-conduct-policy/" },
      { name:"Transportation",      desc:"Busing and eligibility",                  url:"https://www.cps.edu/services-and-supports/transportation-services/" },
      { name:"Parent hub",          desc:"Everything CPS points parents to",        url:"https://www.cps.edu/parents/" }
    ]
  },
  {
    group: "Get involved",
    links: [
      { name:"Volunteer",              desc:"Background check + volunteer types",   url:"https://www.cps.edu/services-and-supports/parent-engagement/volunteer-programs/" },
      { name:"Local School Council",   desc:"LSC role, meetings, elections",        url:"https://www.cps.edu/about/local-school-councils/" },
      { name:"Bilingual Advisory",     desc:"BAC — relevant to dual language",      url:"https://www.cps.edu/services-and-supports/parent-engagement/bilingual-advisory-committees/" },
      { name:"School locator map",     desc:"Attendance boundary check",            url:"https://schoolinfo.cps.edu/schoollocator/index.html?Schools=609942" }
    ]
  }
];

/* ---------- render ---------- */
const STAR = '<svg class="star" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path fill="#C8102E" d="M12 1.6l2.35 6.02 6.45.2-5.06 4-1.74 6.2L12 14.4 6 18.02l-1.74-6.2-5.06-4 6.45-.2z"/></svg>';

function host(url){
  if(!url) return "not set yet";
  if(url.startsWith("tel:")) return "phone";
  try { return new URL(url).hostname.replace(/^www\./,""); } catch(e){ return ""; }
}

const board = document.getElementById("board");
board.innerHTML = LINKS.map(g => `
  <section data-group>
    <div class="sec-head">${STAR}<h2>${g.group}</h2><div class="rule"></div></div>
    <div class="grid">
      ${g.links.map(l => `
        <a class="tile${l.url ? "" : " todo"}"
           href="${l.url || "#"}"
           ${l.url && !l.url.startsWith("tel:") ? 'target="_blank" rel="noopener"' : ""}
           data-search="${(l.name + " " + l.desc + " " + g.group).toLowerCase()}">
          <div class="name">${l.name}</div>
          <div class="desc">${l.desc}</div>
          <div class="host">${host(l.url)}</div>
        </a>`).join("")}
    </div>
  </section>`).join("") + '<div class="empty" id="noresults" hidden>Nothing matches that.</div>';

/* ---------- filter ---------- */
const q = document.getElementById("q");
const noresults = document.getElementById("noresults");

q.addEventListener("input", () => {
  const term = q.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll("section[data-group]").forEach(sec => {
    let visible = 0;
    sec.querySelectorAll("a.tile").forEach(t => {
      const hit = !term || t.dataset.search.includes(term);
      t.hidden = !hit;
      if (hit) visible++;
    });
    sec.hidden = visible === 0;
    shown += visible;
  });
  noresults.hidden = shown > 0;
});

document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === "Escape" && document.activeElement === q) { q.value=""; q.dispatchEvent(new Event("input")); q.blur(); }
});

</script>
</body>
</html>
