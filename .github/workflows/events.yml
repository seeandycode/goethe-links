# Google's public .ics feeds send no CORS header, so the page can't read them
# from the browser. This refreshes events.json instead, which the page loads
# same-origin. A commit here also triggers the usual Pages rebuild.
name: Refresh calendar

on:
  schedule:
    - cron: "15 9 * * *"   # 4:15am Chicago, before anyone opens the page
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "icalendar==7.2.2" "recurring-ical-events==3.8.2"

      - run: python3 tools/build-events.py

      # The script leaves the file alone when nothing moved, so most nights
      # this is a no-op and the repo stays quiet.
      - name: Commit if the calendar changed
        run: |
          if git diff --quiet -- events.json; then
            echo "No calendar changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Refresh calendar events"
          git push
